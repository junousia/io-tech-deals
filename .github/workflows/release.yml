name: Release

# Publishes to npm when a version tag (e.g. v1.0.1) is pushed.
# Auth: NPM_TOKEN repository secret, or npm trusted publishing (OIDC) once configured on npmjs.com.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write   # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run build
      - run: npm test --if-present

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
